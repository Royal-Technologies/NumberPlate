<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Royal Crown Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Accent Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Plate Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect width="116" height="116" x="2" y="2" rx="26" fill="none" stroke="url(#crownGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Royal Crown on top -->
  <g transform="translate(60, 26)" filter="url(#glow)">
    <!-- Crown Base -->
    <path d="M-22,12 L-26,-4 L-12,4 L0,-10 L12,4 L26,-4 L22,12 Z" fill="url(#crownGrad)" />
    <!-- Crown Jewels / Dots -->
    <circle cx="-26" cy="-6" r="2.5" fill="#38bdf8" />
    <circle cx="0" cy="-12" r="3" fill="#ffffff" />
    <circle cx="26" cy="-6" r="2.5" fill="#c084fc" />
    <rect x="-18" y="14" width="36" height="3" rx="1.5" fill="url(#crownGrad)" opacity="0.9" />
  </g>

  <!-- Stylized Vehicle Number Plate in the center -->
  <g transform="translate(60, 76)" filter="url(#shadow)">
    <!-- Plate base -->
    <rect x="-44" y="-24" width="88" height="48" rx="8" fill="url(#plateGrad)" stroke="#1e293b" stroke-width="3" />
    <!-- Inner Border line -->
    <rect x="-40" y="-20" width="80" height="40" rx="5" fill="none" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.7" />
    
    <!-- Plate Screws -->
    <circle cx="-35" cy="-15" r="1.8" fill="#94a3b8" />
    <circle cx="35" cy="-15" r="1.8" fill="#94a3b8" />
    <circle cx="-35" cy="15" r="1.8" fill="#94a3b8" />
    <circle cx="35" cy="15" r="1.8" fill="#94a3b8" />

    <!-- BRTA hologram dot -->
    <circle cx="-24" cy="-2" r="3.5" fill="#10b981" opacity="0.85" />

    <!-- Royal Tech Monogram / Plate Text -->
    <!-- Top line Bangla/Logo placeholder -->
    <rect x="-15" y="-14" width="46" height="5" rx="2.5" fill="#0f172a" />
    <!-- Bottom line Registration number placeholder -->
    <rect x="-15" y="-4" width="46" height="7" rx="2.5" fill="#0f172a" />
    <!-- Small RT Badge -->
    <text x="0" y="14" font-family="'Inter', sans-serif" font-weight="900" font-size="7.5" fill="#4338ca" text-anchor="middle" letter-spacing="1">ROYAL TECH</text>
  </g>

  <!-- Corner Tech Highlights -->
  <circle cx="16" cy="16" r="2" fill="#38bdf8" opacity="0.6" />
  <circle cx="104" cy="104" r="2" fill="#c084fc" opacity="0.6" />
</svg>
